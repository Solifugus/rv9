revision=1
mtype=program

# NOT bisected -- wtap's figure, because this has wtap's shape: whisker
# drawing plus a /touch read, and drawing to /w0 renders on the writer's
# stack (see wflick/build.conf).
#
# It is probably conservative. wtap draws corner marks, so its document
# contains a <path> and reaches do_path and rv9_raster_fill_n, a 624-byte
# frame; wslop is built WSK_MINIMAL and cannot emit a path at all, so its
# document is as shallow as wstat's, which runs at 5120. Against that, wslop's
# own chain is the deepest here -- 992 bytes, from the sample arrays -- and it
# carries a device read wstat does not.
#
# Erring high on purpose: this is run interactively by a person tapping a
# panel, and an overflow halfway through a measurement session costs more than
# the kilobyte does. Bisect it if you want the number; 6144 is the guess.
stack_size=7168
desc="tap five marks and find out how far a finger lands from where it aimed"
devices="/w0 /touch"
