static_size=48
stack_size=2560
revision=2
mtype=program

# A megabyte of external memory is sixteen seconds of two microphones at
# 16 kHz. Recorded there and written afterwards, so a flash stall cannot
# drop samples; see rec.c.
desc="record the microphones to a file"
heap_max=1048576
heap_in=external

# What it needs (docs/design.md §72): devices= it cannot run without,
# uses= only for some of what it does.
devices="/au0"

# Which systems carry it: tools/build_modules.sh --store.
groups="sound"
