# /pub0 -- published values.  /pub0/<name>
#
# Where a real-time component leaves what it observed, so that a reactive
# supervisor in another process can read it. One writer per cell, any
# number of readers, and the last publication survives the publisher --
# which is what somebody investigating a stopped machine needs.
#
# Sized deliberately small. Cells are preallocated and never freed, so this
# is memory spent at boot whether anything publishes or not; sixteen cells
# is more independent components than this machine will run, and 64 bytes
# holds a set of sixteen 32-bit values published together.
dev_name=/pub0
filemgr=pfm
driver=pubmem
opt0=64       # bytes of value per cell
opt1=16       # cells
revision=1
