# /sd0 -- the microSD card.
#
# Same file manager as /r0 and /f0, different driver: gigabytes rather than
# kilobytes, and none of the firmware's own flash wearing out. The card
# shares the display's SPI bus; see drv_sdspi.c.
#
# A card with no RV-9 volume on it is formatted on sight, as the other two
# are. That is a wipe of whatever was there.
dev_name=/sd0
filemgr=rbf
driver=sdspi
revision=1
