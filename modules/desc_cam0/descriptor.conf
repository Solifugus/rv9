# /cam0 -- the camera: the OV5647 on the ribbon under the screen.
#
# Read it for a picture: a JPEG unless RV9_CAM_SS_FORMAT asked for RGB565
# pixels, then RV9_CAM_GS_FRAME says how big it was. See rv9/module.h.
#
# SCF over camera with echo and newline translation off: what comes out is
# a picture. The device has a session, so one process at a time.
#
# The P4 only. Elsewhere the sensor is not on the bus and the device does
# not attach; `have camera` says so.
dev_name=/cam0
filemgr=scf
driver=camera
opt0=0
opt1=0
revision=1
