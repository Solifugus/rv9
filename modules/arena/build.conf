mtype=program

# 64 KB in PSRAM and 192 KB of external budget for itself and everything
# it starts: `arena spawn` gets two children holding theirs, and the
# third is refused by the budget. Refused outright on a board with no
# external memory, which is what external means.
desc="a 64 KB external arena, and proof it arrived zeroed"
heap_max=65536
heap_in=external
ext_max=196608
mandatory="heap_max heap_in ext_max"
