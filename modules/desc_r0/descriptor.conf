# /r0 -- a RAM disk, so RBF can be exercised without an SD card.
#
# When sdspi arrives, its descriptor names the same file manager over a
# different driver, and nothing above changes. That is the claim; this
# device is the cheap way to test it.
dev_name=/r0
filemgr=rbf
driver=ramdisk
opt2=128      # sectors of 512 bytes = 64 KB
revision=1
