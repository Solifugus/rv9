# /r0 -- a RAM disk, so RBF can be exercised without an SD card.
#
# Kept small and deliberately so. /f0 is a megabyte of persistent flash and
# costs no RAM; this is scratch space, and every sector of it is memory
# taken from the network stack. It was 64 KB until that stopped lwIP being
# able to open a socket.
dev_name=/r0
filemgr=rbf
driver=ramdisk
opt2=32       # sectors of 512 bytes = 16 KB (scratch only)
revision=2
