static_size=3328   # sizeof(httpd_statics_t), 3140; checked at entry
revision=2
mtype=program
stack_size=2816    # measured 1632 serving every route (reading /sd0 and hashing the catalog are on this stack); plus a kilobyte

desc="serve this machine's modules to its peers, over HTTP"

# What it needs (docs/design.md §72): devices= it cannot run without,
# uses= only for some of what it does.
devices="/n0 /m0"
uses="/sd0"

# Which systems carry it: tools/build_modules.sh --store.
groups="net"
