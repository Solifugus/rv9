# /pipe -- pipes.  /pipe/<name>
#
# What one program writes, another reads. A pipe is a device like any
# other, so every tool that already reads standard input and writes
# standard output composes through one without being changed.
#
# Named, because two opens have to be able to find the same pipe: that is
# what lets a reader be told the last writer has gone, which is the
# difference between an end of file and a pause. The shell invents names
# for `|`; a robot can use a name it chose, and no shell at all.
#
# Small on purpose. Four pipes of 256 bytes is a kilobyte, spent at boot
# whether anything pipes or not, and a shell pipeline carrying the output
# of `dir` never comes near it.
dev_name=/pipe
filemgr=pipe
driver=pipemem
opt0=256      # bytes of buffer per pipe
opt1=4        # pipes
revision=1
