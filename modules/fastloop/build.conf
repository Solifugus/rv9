static_size=0
stack_size=2048
revision=2
mtype=program

# 2 ms of work in every 5, due within 3: half the CPU and a deadline with
# one millisecond to spare, so that anything run ahead of it is a miss --
# and a miss is fatal, so that missing is unmistakable. 500 permille.
desc="a loop with a lot of work and a tight deadline, for priority to protect"
class=realtime
heap_max=0
period_us=5000
deadline_us=3000
wcet_us=2500
on_deadline=fault
mandatory="heap_max on_deadline"
