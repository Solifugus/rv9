# A deadline a tenth of the period, so that waiting a scheduler tick for a
# peer at the same priority is enough to miss it -- and a miss is fatal, so
# that missing it is unmistakable. 40 permille of CPU.
desc="a fast loop with a tight deadline, for priority to protect"
class=realtime
heap_max=0
period_us=5000
deadline_us=500
wcet_us=200
on_deadline=fault
mandatory="heap_max on_deadline"
