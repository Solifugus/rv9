# Measured by bisection on the board: 5120 overflows, 6144 runs. Plus a
# kilobyte, the way `control` and `pic` do it.
#
# It is large because of something that is not whisker's doing and is worth
# knowing before writing anything else that draws: drawing to /w0 renders on
# the WRITER's stack (modules/pic says so too). whisker streams rather than
# buffers, so the put() that completes the document runs the entire renderer
# with every layout frame still live beneath it -- the two depths add.
#
# It was 2048 at iteration 1, which never ran; 4096 after the header refresh,
# which also never ran.
stack_size=7168
desc="flick, generated from a whisker widget tree"
devices="/w0"
