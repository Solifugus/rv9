# /w0 -- a graphics window. Write SVG to it.
#
#   cat picture.svg > /w0
#   echo '<svg><circle cx="50" cy="50" r="40" fill="red"/></svg>' > /w0
#
# SCF over svgwin: a picture is a stream of bytes and a path carries bytes,
# so nothing above needs a graphics API. Echo and autolf are both off --
# this is not a terminal and a newline is not a carriage return here.
#
# opt2 rotation: must agree with desc_term. There is one panel.
# opt3 background, RGB565.
dev_name=/w0
filemgr=scf
driver=svgwin
opt0=0
opt1=0
opt2=1
opt3=0
revision=1
