# /m0 -- the modules this machine holds, as files.  /m0/<name>
#
# Read-only: the store's modules, and any `load` brought in, byte for byte.
# `dir /m0` lists them; `copy /m0/pubs /sd0/cmd/pubs.mod` puts one on the
# card; `httpd` serves them to a peer. A module's signature is part of its
# bytes, so it travels with it.
dev_name=/m0
filemgr=mfm
driver=moddir
revision=1
