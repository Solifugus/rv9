# /i2c0 -- the two-wire bus.  /i2c0/<address>
#
# Where sensors live. An address in hex as the datasheet writes it
# (/i2c0/0x68) or in decimal (/i2c0/104); both are accepted because one is
# what you read and the other is what you type in a script.
#
# The pins are left to the driver, which is compiled per board and knows
# them: 8 and 9 on the C5, 7 and 8 on the P4. This file is built into one
# module store that is flashed to either board, so it cannot hold two
# answers -- and a pin number is a fact about a board rather than a choice
# anybody makes. See the note at the top of drv_i2c.c.
#
# The speed IS a choice and stays here. 100 kHz because it works on a
# breadboard with no pull-up resistors fitted. 400 is available and wants
# real 4.7k pull-ups on both lines.
dev_name=/i2c0
filemgr=ifm
driver=i2c
opt0=0        # SDA: 0 means the driver's, which is the board's
opt1=0        # SCL: the same
opt2=100      # kHz
revision=1
