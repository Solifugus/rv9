# /i2c0 -- the two-wire bus.  /i2c0/<address>
#
# Where sensors live. An address in hex as the datasheet writes it
# (/i2c0/0x68) or in decimal (/i2c0/104); both are accepted because one is
# what you read and the other is what you type in a script.
#
# Pins 8 and 9 are free on this board: 4-7 belong to the SPI bus the panel
# and the card share, 10 is the backlight, 13 and 14 are the USB console,
# and 23, 24 and 26 are the display's control lines.
#
# 100 kHz because it works on a breadboard with no pull-up resistors
# fitted. 400 is available and wants real 4.7k pull-ups on both lines.
dev_name=/i2c0
filemgr=ifm
driver=i2c
opt0=8        # SDA
opt1=9        # SCL
opt2=100      # kHz
revision=1
