static_size=432    # sizeof(detect_statics_t), 420
stack_size=4096    # pico_post keeps 64 candidate boxes on the stack
revision=1
mtype=program

# The model (348 KB), its activations (539 KB) and one camera frame (1 MB),
# all in external memory: about 1.9 MB, given at fork.
desc="find the people in front of the camera"
heap_max=2097152
heap_in=external

# -O2: the layers are 67 million multiply-adds a picture, and -Os costs
# them more than the bytes it saves.
opt=O2

# The P4's vector unit, for the layers. Every board gets these opcodes in
# the store, so detect runs them only when RV9_ISA_PIE says the CPU has it.
cflags="-march=rv32imac_zicsr_zifencei_zaamo_zalrsc_xespv -DPICO_PIE"
