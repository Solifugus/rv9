static_size=1536   # sizeof(detect_statics_t), about 1380
stack_size=12288   # 64 candidates of 64 bytes, twice over in the face path
revision=2
mtype=program

# Who needs most: 1.4 MB of models (the two face stages and the 1.2 MB
# signature model), 784 KB of activations, a 1 MB camera frame and 66 KB
# for 64 learnt faces. People need 412 KB, 539 KB and the frame. All
# external memory, given at fork.
desc="find the people, or the faces, in front of the camera"
heap_max=4194304
heap_in=external

# -O2: the layers are 67 million multiply-adds a picture, and -Os costs
# them more than the bytes it saves.
opt=O2

# The P4's vector unit, for the layers. Every board gets these opcodes in
# the store, so detect runs them only when RV9_ISA_PIE says the CPU has it.
cflags="-march=rv32imac_zicsr_zifencei_zaamo_zalrsc_xespv_xesploop -DPICO_PIE"

# With -p, what it saw, for whoever acts on it. Declared here, so a watcher
# is admitted whether or not detect is running yet.
publishes="/pub0/SEEN"

# The files it reads, each with the SHA-256 of the build it was made for;
# tools/mksystem.py puts them on the card, and `get` checks what it fetches.
files="/sd0/pico.rv9m=240a73e1a3a329368efc8e8c693ca454645f79dc756c73d89790ccedfaa84b70 \
       /sd0/face1.rv9m=07591b499b5901e13678d3a78b1f86039ab379e977d436414f0c8803508f8835 \
       /sd0/face2.rv9m=2dc53389ecf74fc47413b1aa574a55e51422be3e869807d8a9de61136e3c970e \
       /sd0/feat.rv9m=37e1df3829ac08fdbe6d9725aa1db4146cc32a7f9ea265b047b57458b352e15d"

# What it needs (docs/design.md §72): devices= it cannot run without,
# uses= only for some of what it does.
uses="/cam0"

# Which systems carry it: tools/build_modules.sh --store.
groups="vision"
