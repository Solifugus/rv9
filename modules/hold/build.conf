static_size=0
stack_size=2048
revision=1
mtype=program

# What this program says it must own. RV-9 claims /pwm0/3 for this
# process at fork -- before the code below runs and before a second copy
# of it can be started -- and takes it back when the process ends, however
# it ends.
#
# The stack is sized for `smash`, which this chains to in crash mode: a
# chained module gets its own statics but runs on the stack its
# predecessor was given.
desc="hold a declared exclusive device, and optionally die holding it"
exclusives="/pwm0/3"
