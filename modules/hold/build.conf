static_size=0
stack_size=2048
revision=2
mtype=program

# What this program says it must own. RV-9 claims both for this process at
# fork -- before the code runs and before a second copy of it can be
# started -- and takes them back when the process ends, however it ends.
#
# The failsafe is a constant and a device name, and nothing else. It is
# applied with this process already dead, frequently because it ran off
# its own stack, so there is nobody left to run cleanup code: RV-9 writes
# the number to the device itself.
#
# /gpio/2 holds its level when released, so a parked 0 stays 0. /pwm0/3
# does not -- its driver gives the channel back and stops driving, which
# is its own safe state -- so declaring a value for it would be a promise
# that expires at the moment it matters. Admission says so if you try.
#
# The stack is sized for `smash`, which this chains to in crash mode: a
# chained module gets its own statics but runs on the stack its
# predecessor was given.
desc="hold declared exclusive devices, and optionally die holding them"
exclusives="/pwm0/3 /gpio/2"
failsafes="/gpio/2=0"
