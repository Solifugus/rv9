static_size=8
revision=4
mtype=program

# Measured: 1148 bytes. 3072 rather than the 8 KB default.
stack_size=2560     # measured 1136 used; plus a kilobyte

# Each session is a shell and whatever it runs, all charged here: a shell
# (4.6 KB) and `ed` (17.4 KB) is already over the 32 KB default with the
# daemon itself. 40 KB holds that with room for a background job.
mem_max=40960

# What it needs (docs/design.md §72): devices= it cannot run without,
# uses= only for some of what it does.
devices="/n0"
modules="shell"

# Which systems carry it: tools/build_modules.sh --store.
groups="net"
