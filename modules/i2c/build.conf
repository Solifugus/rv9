# Consumed by tools/build_modules.sh
static_size=32    # sizeof(i2c_statics_t): one burst read
revision=1
mtype=program
stack_size=2048     # a scan opens and closes 119 paths; measured after a run

# What it needs (docs/design.md §72): devices= it cannot run without,
# uses= only for some of what it does.
devices="/i2c0"

# Which systems carry it: tools/build_modules.sh --store.
groups="pins"
