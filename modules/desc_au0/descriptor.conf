# /au0 -- the board's two microphones and its speaker.
#
# Read it to hear, write it to speak: 16 kHz frames of two 16-bit samples,
# MIC1 and MIC2 on the way in, left to the speaker on the way out. Ask
# RV9_AU_GS_FORMAT rather than assuming that. See rv9/module.h.
#
# SCF over audio, with echo and newline translation off: these are samples,
# and a sample that happens to be 0x0a is not a line ending. The driver
# marks itself raw, so reads hand over whatever has arrived.
#
# The codecs are found on the bus or the device does not attach -- the C5
# and C3 have none, and `have audio` says no there.
dev_name=/au0
filemgr=scf
driver=audio
opt0=0
opt1=0
revision=1
