static_size=12
revision=1
mtype=program

# Same reason wflick needs 7168: drawing to /w0 renders on the WRITER's
# stack, and whisker streams rather than buffers, so the put() that finishes
# the document runs the whole renderer with every layout frame still live
# beneath it. This one also carries the touch read, so it gets wflick's
# figure rather than a guess -- bisect it if it ever overflows.
stack_size=7168
desc="press a whisker button on the glass"
devices="/w0 /touch"
