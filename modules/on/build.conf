static_size=1024   # sizeof(on_statics_t), 960; checked at entry
revision=1
mtype=program
stack_size=4096     # a guess until measured
desc="run a command on another machine, as if here"

# What it needs (docs/design.md §72): devices= it cannot run without. The
# command it runs is the peer's, and costs this machine nothing.
devices="/peer"

# Which systems carry it: tools/build_modules.sh --store.
groups="net"
