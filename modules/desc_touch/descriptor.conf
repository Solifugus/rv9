# /touch -- the touch panel, as a stream of events.
#
# Reads give whole rv9_touch_event_t records, oldest first, and block until
# there is one; see the note beside the struct in rv9/module.h for why this
# is a stream and not a cell somebody polls.
#
# The driver is a GT911 on the bus /i2c0 serves, so this device exists only
# on a board that has one. The C5 has no touch panel: nothing answers, the
# device does not attach, and `have touch` says no -- which is the device
# model working rather than a failure to apologise for.
#
# The address is not an option because the board straps it and the driver
# asks (0x5D, or 0x14 on boards strapped the other way). The mirroring is
# not an option either: it comes from the panel, which is the one place
# that knows how the glass is fitted.
dev_name=/touch
filemgr=scf
driver=touch
opt0=16       # poll interval in ms -- about 60 Hz; the interrupt line is
              # not wired on this board, so it is polled
opt1=32       # queue depth in events
revision=1
