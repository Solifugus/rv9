static_size=8     # two uint32s
revision=4
mtype=program

# Measured: 2512 bytes, after handshakes -- key exchange runs in sshd's own
# open of /ssh0, so this is the deep case, WiFi interrupt frames included.
# 4096 rather than the 8 KB default; init restarts sshd if it ever dies.
stack_size=4096

# Each session is a shell and whatever it runs, all charged here: a shell
# (4.6 KB) and `ed` (17.4 KB) is already over the 32 KB default with the
# daemon itself. 40 KB holds that with room for a background job.
mem_max=40960
