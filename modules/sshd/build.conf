static_size=8     # two uint32s
revision=6
mtype=program

# Measured: 2512 bytes, after handshakes -- key exchange runs in sshd's own
# open of /ssh0, so this is the deep case, WiFi interrupt frames included.
# 4096 rather than the 8 KB default; init restarts sshd if it ever dies.
stack_size=3584     # measured 2520 used, the whole handshake included; plus a kilobyte

# Each session is a shell and whatever it runs, all charged here: a shell
# (4.6 KB) and `ed` (17.4 KB) is already over the 32 KB default with the
# daemon itself. 40 KB held that with room for a background job; 128 KB
# holds `listen` (61 KB: Whistle's 52 KB stack) beside a session, and
# leaves well over half of what programs may have at idle (about 280 KB).
mem_max=131072

# What it needs (docs/design.md §72): devices= it cannot run without,
# uses= only for some of what it does.
devices="/ssh0"
modules="shell"

# Which systems carry it: tools/build_modules.sh --store.
groups="net"
