# /ssh0 -- a shell over SSH.
#
# Opening it waits for a client to connect, prove who it is, and ask for a
# shell; reading and writing it move plaintext. SCF sits on top, so the
# session gets line discipline, echo and cursor addressing the same way the
# serial console does -- which is what a client in raw mode needs.
#
# opt0 echo, opt1 autolf: both on, because an ssh client with a pty echoes
# nothing locally and expects CR LF at the end of a line.
# opt2 port.
dev_name=/ssh0
filemgr=scf
driver=ssh
opt0=1
opt1=1
opt2=22
revision=1
