static_size=0
revision=1
mtype=program

# NOT bisected: derived from wstat's, which was. wstat runs at 5120 with an
# 880-byte module chain and a document containing no <path>; wfont's chain is
# 720 and its document is also path-free, so the renderer never enters do_path
# and the two should sit together. Declared at wstat's figure rather than
# lower, because the saving is not worth a second bisection.
#
# If you do bisect it, it should run below 5120. See wflick/build.conf for why
# a /w0 writer's stack is mostly not its own, and wstat/build.conf for why the
# figure depends on what the DOCUMENT contains.
stack_size=6144
desc="the same text at seven sizes, to find the legibility floor by looking"
devices="/w0"
