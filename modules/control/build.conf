stack_size=1536
revision=5
mtype=program

# The resource contract. Everything below is what the program says it
# needs; RV-9 decides whether the machine can honour it.
#
# `rt control` with no period now runs at 1 kHz because the module says so,
# rather than because the shell guessed. heap_max is zero and mandatory: a
# control loop that allocates on its time-critical path is not a control
# loop, and a system that cannot enforce that should refuse to run it
# rather than pretend.
#
# It declares the cell it publishes, rather than the device. /pub0 carries
# every other component's cells too, and claiming the whole of it would
# stop them; /pub0/CONTROL is this program's, reserved at fork, so a second
# copy is refused before it starts and nothing else can write into it. A
# supervisor declaring watches="/pub0/CONTROL" is admitted because this
# declaration exists on the machine, whether or not control is running.
#
# Measured, 2026-09-12, publishing every period into /pub0/CONTROL with a
# watcher attached: 13 us worst execution warm, 30-38 us on the first run
# of a boot, no overruns. Declaring 50 holds comfortably.
#
# It did not, at first. Publishing from inside the loop with no warm-up
# reached 49-50 us on the first run -- the whole declared budget, spent on
# the first call through the I/O manager rather than on control. One
# throwaway write before rt_declare fixed it. That is what the
# initialisation phase is for, and the numbers above are with it.
desc="periodic PI control loop with honest jitter reporting"
class=realtime
heap_max=0
period_us=1000
deadline_us=1000
wcet_us=50
publishes="/pub0/CONTROL"
mandatory="heap_max"
