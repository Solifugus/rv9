static_size=16
stack_size=1536
revision=2
mtype=program

# The resource contract. Everything below is what the program says it
# needs; RV-9 decides whether the machine can honour it.
#
# `rt control` with no period now runs at 1 kHz because the module says so,
# rather than because the shell guessed. heap_max is zero and mandatory: a
# control loop that allocates on its time-critical path is not a control
# loop, and a system that cannot enforce that should refuse to run it
# rather than pretend.
desc="periodic PI control loop with honest jitter reporting"
class=realtime
heap_max=0
period_us=1000
deadline_us=1000
wcet_us=50
mandatory="heap_max"
