static_size=7680   # sizeof(listen_statics_t), 7656
stack_size=53248   # measured 43,972 at the deepest, in the decoder; the rest for a sleep's frames and the FPU's trap
revision=4
mtype=program

desc="hear something said, and write down what it was"

# Its own budget: the stack and statics, with room. The console shell's
# budget is sized for it (modules/shell/build.conf).
mem_max=65536

# The 17 MB model, the audio and the engine's work, all external: 26.6 MB
# at most, for 16 seconds. /tts0 gives its voice back when it has been idle
# three seconds, which leaves 31.9 MB in one block.
heap_max=28835840
heap_in=external

opt=O2

# Whistle's engine, vendored in needle/; the P4's FPU and vector unit,
# asked for first; s11 for the engine's context (nd_mod.h). The engine is
# compiled as written, which is not -Wall -Wextra clean.
sources="needle/src/nd_whistle.c needle/src/nd_quant_p4.c needle/src/nd_tokenizer.c needle/src/nd_cact.c needle/src/nd_ledcmd.c"
cflags="-march=rv32imafc_zicsr_zifencei_zaamo_zalrsc_xespv -ffixed-s11 -fsingle-precision-constant -include nd_mod.h -I. -Ineedle/include -w"

# What it reads off the card, which tools/mksystem.py puts there.
files="whistle.cact"

# Which systems carry it: tools/build_modules.sh --store.
groups="sound"
