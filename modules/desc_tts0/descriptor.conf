# /tts0 -- text to speech: CMU Flite, behind a device.
#
# Write text, setstat RV9_TTS_SS_DONE, read 16 kHz mono 16-bit samples as
# they are made. See rv9/module.h. The voice is read on first use from
# /sd0/slt.flitevox and stays in external memory.
#
# SCF over tts with echo and newline translation off: what comes out is
# samples. The device has a session, so one process at a time.
#
# The P4 only. Elsewhere the driver finds no room for a voice and the
# device does not attach.
dev_name=/tts0
filemgr=scf
driver=tts
opt0=0
opt1=0
revision=1
