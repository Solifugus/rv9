static_size=16
revision=4
mtype=program

# Event-driven rather than periodic: there is no period to declare at
# fork, only a minimum interval between arrivals, and even that is given
# on the command line because the point of the module is to vary it. So
# admission has nothing to account here, and says so.
desc="latency from an interrupt to a real-time process running"
class=realtime
stack_size=2560     # measured peak 1096, plus a kilobyte

# What it needs (docs/design.md §72): devices= it cannot run without,
# uses= only for some of what it does.
devices="/gpio"
modules="edgegen"

# Which systems carry it: tools/build_modules.sh --store.
groups="rt"
