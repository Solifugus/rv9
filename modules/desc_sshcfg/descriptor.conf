# /sshcfg -- the SSH driver with nothing behind it.
#
# The same driver as /ssh0, bound so that opening it waits for nobody. It
# exists because /ssh0 blocks until somebody logs in, and the password has
# to be settable before the first login rather than after it.
#
# opt3=1 is what says "configuration only".
dev_name=/sshcfg
filemgr=scf
driver=ssh
opt0=0
opt1=0
opt2=0
opt3=1
revision=1
