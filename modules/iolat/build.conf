# The resource contract. iolat exists to measure how long an I/O call
# takes from inside a real-time loop, so its execution time is the thing
# under test rather than a constant -- which is why the WCET below is
# generous and why the loop is bounded to a fraction of its period.
desc="how long an I/O call takes from inside a real-time loop"
class=realtime
period_us=1000
deadline_us=1000
wcet_us=300
