static_size=0
stack_size=2048
revision=1
mtype=program

# No on_deadline: a late period is reported, not a fault. Running away is
# stopped anyway -- see RV9_RT_RUNAWAY_MS -- which is the point of this
# module. The pin is there so that being stopped from outside can be seen
# to park it, exactly as ending any other way does.
desc="a real-time loop that stops waiting"
class=realtime
heap_max=0
period_us=10000
wcet_us=500
exclusives="/gpio/2"
failsafes="/gpio/2=0"
mandatory="heap_max"
