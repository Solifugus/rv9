# /stt0 -- speech to text: Whistle, behind a device.
#
# Write 16 kHz mono 16-bit samples, setstat RV9_STT_SS_DONE, read a line of
# text. See rv9/module.h. The model is read on first use from
# /sd0/whistle.cact and stays in external memory.
#
# SCF over stt with echo and newline translation off: what goes in is
# samples. The device has a session, so one process at a time.
#
# The P4 only. Elsewhere the driver finds no room for a model and the
# device does not attach.
dev_name=/stt0
filemgr=scf
driver=stt
opt0=0
opt1=0
revision=1
