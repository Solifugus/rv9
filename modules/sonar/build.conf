static_size=80
stack_size=2560     # the shape of control's work; control measured 1372
revision=1
mtype=program

# The resource contract. Everything below is what the program says it
# needs; RV-9 decides whether the machine can honour it.
#
# 100 ms because the sensor says so, not because the loop wants to be slow:
# a ranger must not be re-triggered until the previous burst's echoes have
# died away, or the next reading is the last one's reflection off the far
# wall. Datasheets say 60 ms. This is that with room, and it is the period
# a compiler reading rv9-profile.json would be told about.
#
# The deadline is the period: a reading that arrives after the next trigger
# has already gone out is a reading about a moment that has passed.
#
# wcet_us is the interesting number. The loop never waits for the sensor --
# it triggers and reads the previous activation's answer, so the 30 ms the
# hardware may take is spent entirely outside the activation. What is left
# is two getstats, four pin writes and a publish.
#
# Measured, 2026-09-21, with no sensor attached: worst execute 173 us,
# worst jitter 39 us, no overruns. That is a hundred and seventy-three
# microseconds of activation for a device whose physical response is thirty
# milliseconds -- the whole point of reading last time's answer.
#
# All four of those activations were cold: the loop gives up after five
# silent periods, so it never ran long enough to warm. control's first
# activation of a boot cost three times its warm one, which is why 250 is
# declared against 173 seen rather than trimmed to fit.
#
# The pin is exclusive because a second copy of this loop triggering the
# same sensor would interleave bursts with echoes, and both would read the
# other's reflections. It is also the failsafe: /gpio holds its level when
# released, so a parked 0 stays 0 after this process is gone, however it
# went -- which is the point of declaring it rather than writing cleanup
# code that a faulted process never reaches.
desc="real-time sonic ranging loop; publishes /pub0/DISTANCE"
class=realtime
heap_max=0
period_us=100000
deadline_us=100000
wcet_us=250
exclusives="/gpio/11"
failsafes="/gpio/11=0"
# Millimetres, said out loud. A watcher declaring `:m` is refused at
# admission with both units named, which is R9's dimensional guarantee
# surviving past the compiler into the machine two components meet on.
publishes="/pub0/DISTANCE:mm"
mandatory="heap_max"
