# /n0 -- the network.
#
#   /n0                 the device: status and configuration
#   /n0/<host>/<port>   connect outbound
#   /n0/listen/<port>   wait for one inbound connection
#
# opt0 band: 0/3 = both, 1 = 2.4 GHz only, 2 = 5 GHz only
# opt1 power save: 0 = none, 1 = min modem, 2 = max modem.
#   Off, because a round trip goes from about 2 ms to 240 ms with it on --
#   the reply waits for the next beacon. Turn it on for anything running
#   from a cell, where the radio is the largest draw there is.
dev_name=/n0
filemgr=nfm
driver=net
opt0=0
opt1=0
revision=4
