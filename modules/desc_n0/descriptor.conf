# /n0 -- the network.
#
#   /n0                 the device: status and configuration
#   /n0/<host>/<port>   connect outbound
#   /n0/listen/<port>   wait for one inbound connection
#
# opt0 band: 0/3 = both, 1 = 2.4 GHz only, 2 = 5 GHz only
# opt1 power save: 0 = none, 1 = min modem, 2 = max modem.
#   Min modem, which is what ESP-IDF ships. It costs latency -- a reply
#   waits for the next beacon -- but turning it off makes this board lose
#   the access point altogether (reason 200, beacon timeout), which is not
#   a trade, it is a fault. See the note in drv_net.c.
dev_name=/n0
filemgr=nfm
driver=net
opt0=0
opt1=1
revision=5
