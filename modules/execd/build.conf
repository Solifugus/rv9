static_size=1408   # sizeof(execd_statics_t), 1336; checked at entry
revision=2
mtype=program
stack_size=4096     # a guess until measured
desc="run commands here for the peers in /f0/callers"

# A session and the command it runs are charged here, as rshd's are: listen
# on the P4 is 61 KB of its own.
mem_max=131072

# What it needs (docs/design.md §72): devices= it cannot run without.
devices="/peer /n0"

# Which systems carry it: tools/build_modules.sh --store.
groups="net"
