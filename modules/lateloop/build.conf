static_size=0
stack_size=2048
revision=2
mtype=program

# A loop whose late output is wrong output, and says so.
#
# on_deadline=fault is what makes the difference: without it a miss is
# counted, as every miss always has been, and the loop carries on. With it
# the late activation is the last one. It is mandatory because a system
# that does not understand it would run this loop under the lenient
# policy, which is exactly the contract it was written to refuse.
#
# The deadline is a fifth of the period so the miss is unambiguous: 5 ms of
# work against 2 ms allowed, with 8 ms to spare before the next release, so
# what is being stopped is the late answer and not a pile-up.
desc="a control loop that misses its deadline on purpose"
class=realtime
heap_max=0
period_us=10000
deadline_us=2000
wcet_us=500
on_deadline=fault
exclusives="/gpio/2"
failsafes="/gpio/2=0"
mandatory="heap_max on_deadline"
