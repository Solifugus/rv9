static_size=0
revision=1
mtype=program

# NOT bisected. whisker's own chain is about 2,500 bytes (tools/evidence/stack
# in whisker, counting its nesting), and drawing to /w0 renders on the
# writer's stack beneath it -- at least 4,528 more for a whisker document
# (see wflick/build.conf). Declared 8192 until the board says otherwise.
stack_size=8192
desc="type with a finger: a field and an on-screen keyboard"
devices="/w0 /touch"    # space separated: a comma made it one device name

# Which systems carry it: tools/build_modules.sh --store.
groups="screen"
