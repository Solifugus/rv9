static_size=0
revision=1
mtype=program

# NOT bisected. whisker's own chain is 2,288 bytes three levels deep -- each
# level of nesting adds 256, and tools/evidence/stack in whisker prints it --
# and drawing to /w0 renders on the writer's stack beneath that, at least
# 4,528 more for a whisker document (see wflick/build.conf). So more than
# 6,816; declared at 8192 until the board says otherwise.
stack_size=8192
desc="a window that is one tree: taps name the deepest widget"
devices="/w0 /touch"    # space separated: a comma made it one device name

# Which systems carry it: tools/build_modules.sh --store.
groups="screen"
