static_size=4096   # sizeof(snap_statics_t)
stack_size=2048
revision=1
mtype=program

desc="take a picture with the camera and save it"

# What it needs (docs/design.md §72): devices= it cannot run without,
# uses= only for some of what it does.
devices="/cam0"

# Which systems carry it: tools/build_modules.sh --store.
groups="vision"
