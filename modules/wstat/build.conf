static_size=0
revision=1
mtype=program

# Bisected on the board 2026-10-03: runs at 5120. Plus a kilobyte, the way
# `control` and `pic` do it.
#
# The estimate this arrived with -- "a minimum somewhere near 6432", from the
# call graph plus wflick's measurement -- was pessimistic, and the reason is
# worth more than the number: wstat needs LESS than wflick despite a deeper
# chain of its own, because the renderer's depth depends on what the DOCUMENT
# contains. wflick draws corner marks, so it reaches do_path and
# rv9_raster_fill_n, which is a 624-byte frame on its own. wstat's 138-byte
# readout has no paths in it at all.
#
# So a stack figure measured with one document does not transfer to another,
# and the one to measure with is the richest thing the program can emit.
#
# See wflick/build.conf for why a /w0 writer's stack is mostly not its own.
stack_size=6144
desc="die temperature, heap and uptime on the panel, repainting only what changed"
devices="/w0 /tsens"    # space separated: a comma made it one device name
