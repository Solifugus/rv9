static_size=1528  # three LINE_MAX buffers (one holds what has arrived and is not used yet), the term path, the pipe counter, the last status and fault, the script path, 16 process records for the fallback procs
revision=15
mtype=program

# Measured, not guessed: 1192 bytes used idle on the console, 1400 serving
# an SSH session with WiFi busy -- interrupt frames land on this stack and
# are in those figures. It had the 8 KB default, which left 6.8 KB unused
# in every session; a session plus one background job then left too little
# heap to fork `procs`. 4096 is nearly three times what was seen, and an
# overflow is caught by the stack guard and the shell restarted by init.
stack_size=2560     # measured 1440 used by a session's shell, its output encrypted on this stack; plus a kilobyte
