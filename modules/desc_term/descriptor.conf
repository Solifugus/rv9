# /term -- the LCD text console
#
# Glyphs are 10x20 and anti-aliased, so scale 1 is the normal case and gives
# 30x8 cells in landscape. Scale 2 doubles that to 15x4 for anyone who wants
# very large text.
#
# Colours are RGB565. White on navy reads better on this panel than the
# grey-on-black it started with.
dev_name=/term
filemgr=scf
driver=lcdcon
opt0=0        # echo: nothing to echo to yet
opt1=0        # autolf: the console handles \n itself
opt2=1        # glyph scale
opt3=1        # 1 = landscape
opt4=0xFFFF   # foreground: pure white
opt5=0x0195   # background: #0033aa navy
opt6=6        # left/right margin: clears the rounded corners
opt7=4        # top/bottom margin
revision=5
