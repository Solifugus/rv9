static_size=0
revision=1
mtype=program

# NOT bisected. whisker's own chain is 1,856 bytes (its tools/evidence/stack
# figure for this program), and drawing to /w0 renders on the writer's stack
# -- at least 4,528 more for a whisker document (see wflick/build.conf). Its
# rows are plain buttons with no corner marks, so the document never reaches
# do_path; wslop's shape, at wslop's figure plus a kilobyte for the deeper
# chain. Bisect it if you want the number.
stack_size=8192
desc="drag a list of ten thousand rows and time every frame"
devices="/w0 /touch"    # space separated: a comma made it one device name

# Which systems carry it: tools/build_modules.sh --store.
groups="screen"
