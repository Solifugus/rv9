# /peer -- other machines' modules, as files.  /peer/<name>/<rest>
#
# GET /<rest> from the peer /f0/peers names, so /peer/p4/cmd/listen.mod is
# the P4's listen, as its httpd serves it. A module path entry of
# /peer/p4/cmd/ runs what the P4 holds; a module from a peer must be signed
# by a key in /f0/trust.
dev_name=/peer
filemgr=peerfm
driver=peer
revision=1
